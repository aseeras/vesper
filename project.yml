name: Vesper
options:
  bundleIdPrefix: com.aseeras
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  VesperCore:
    path: Packages/VesperCore
  MetaWearables:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  Vesper:
    type: application
    platform: iOS
    sources:
      - path: App/Vesper
        excludes:
          - "Resources/Custom/**"
      - path: App/Vesper/Resources/Custom
        type: folder
        buildPhase: resources
    dependencies:
      - package: VesperCore
      - package: MetaWearables
        product: MWDATCore
      - package: MetaWearables
        product: MWDATCamera
      - package: MetaWearables
        product: MWDATDisplay
      - sdk: CarPlay.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aseeras.vesper
        INFOPLIST_FILE: App/Vesper/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(VESPER_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  Vesper:
    build:
      targets:
        Vesper: all
