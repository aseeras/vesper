name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core logic tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Test VesperCore
        working-directory: Packages/VesperCore
        run: swift test

  app-build:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          if ! xcodebuild build \
              -project Vesper.xcodeproj -scheme Vesper \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            grep -E "error:" build.log | sort -u | head -80
            tail -40 build.log
            exit 1
          fi
          grep -E "warning:" build.log | grep -v "/SourcePackages/" | sort -u | head -40 || true
          echo "Build succeeded"
