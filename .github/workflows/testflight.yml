name: TestFlight

# Builds Vesper and uploads it to TestFlight. Runs on every push to main, or by hand
# from the Actions tab. Needs these repository secrets (Settings → Secrets → Actions):
#   APPLE_TEAM_ID           10-character Apple Developer Team ID
#   ASC_KEY_ID              App Store Connect API key ID
#   ASC_ISSUER_ID           App Store Connect API issuer ID
#   ASC_KEY_P8              Contents of the AuthKey_XXXX.p8 file (including BEGIN/END lines)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Write App Store Connect key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      # Each fresh runner makes a throwaway "Created via API" development certificate when it
      # signs. Apple caps them, so remove the ones earlier builds left behind. Certificates
      # made any other way (e.g. in Xcode on a Mac, with a person's name) are never touched.
      - name: Remove old CI signing certificates
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography requests 2>/dev/null \
            || pip3 install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "asc", "AuthKey.p8")).read()
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ISSUER"], "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          H = {"Authorization": f"Bearer {token}"}
          API = "https://api.appstoreconnect.apple.com/v1/certificates"
          r = requests.get(API, headers=H, params={"limit": 200}, timeout=60); r.raise_for_status()
          for c in r.json()["data"]:
              a = c["attributes"]
              name = f'{a.get("name", "")} {a.get("displayName", "")}'
              if a.get("certificateType") in ("DEVELOPMENT", "IOS_DEVELOPMENT") and "Created via API" in name:
                  d = requests.delete(f"{API}/{c['id']}", headers=H, timeout=60)
                  print(f"revoke {a.get('displayName') or a.get('name')} ({a.get('serialNumber')}): {d.status_code}")
              else:
                  print(f"keep   {a.get('certificateType')} {name.strip()}")
          PY

      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          if ! xcodebuild archive \
              -project Vesper.xcodeproj -scheme Vesper -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Vesper.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
              -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
              DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
              CURRENT_PROJECT_VERSION="${{ github.run_number }}" > archive.log 2>&1; then
            grep -E "error:" archive.log | sort -u | head -60
            tail -40 archive.log
            exit 1
          fi
          echo "Archived build ${{ github.run_number }}"

      - name: Export signed IPA
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" Config/ExportOptions.plist
          if ! xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Vesper.xcarchive" \
              -exportOptionsPlist Config/ExportOptions.plist \
              -exportPath "$RUNNER_TEMP/export" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
              -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" > export.log 2>&1; then
            grep -iE "error|invalid|failed" export.log | sort -u | head -60
            find /var/folders -name "IDEDistribution*.log" -newer archive.log 2>/dev/null | head -3 | xargs -I{} sh -c 'echo "== {}"; grep -iE "error|status|message" "{}" | tail -40'
            exit 1
          fi
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # altool finds the key by ID in this folder, and reports App Store Connect's own error text.
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/asc/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          # altool can exit 0 even when App Store Connect rejects the upload, so check its output too.
          set +e
          xcrun altool --upload-app --type ios \
            --file "$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER" --show-progress 2>&1 | tee upload.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || grep -q "ERROR" upload.log || ! grep -qiE "UPLOAD SUCCEEDED|No errors uploading" upload.log; then
            echo "::error::Upload to App Store Connect failed (see ERROR lines above)."
            exit 1
          fi
          echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple processes it (usually 5–15 minutes)."

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" ~/.appstoreconnect
